<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMP NYC Map</title>
    <meta
      name="description"
      content="Interactive map of participating Brooklyn and Bronx restaurants for the Restaurant Meals Program."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="user-location.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-block">
        <div class="brand-mark">RMP</div>
        <div>
          <p class="eyebrow">Ready Meal Program</p>
          <h1>NYC Restaurant Map</h1>
        </div>
      </div>
      <div class="header-actions">
        <label class="search-wrap" for="restaurant-search">
          <span>Search</span>
          <input
            id="restaurant-search"
            type="search"
            placeholder="Search by restaurant or address"
            aria-label="Search restaurants"
          />
        </label>
        <label class="select-wrap" for="borough-select">
          <span>Borough</span>
          <select id="borough-select" aria-label="Filter borough">
            <option value="All" selected>All</option>
            <option value="Brooklyn">Brooklyn</option>
            <option value="Bronx">Bronx</option>
          </select>
        </label>
      </div>
    </header>

    <main class="page-shell">
      <aside class="restaurant-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow light">Participating locations</p>
            <h2 id="restaurant-count">0 restaurants</h2>
          </div>
          <button id="reset-button" type="button" class="ghost-button">Reset</button>
        </div>
        <div id="restaurant-list" class="restaurant-list" aria-live="polite"></div>
      </aside>

      <section class="map-panel">
        <div id="status-bar" class="status-bar">Loading restaurant locations…</div>
        <div id="map" aria-label="Interactive map of participating restaurants"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
    <script src="user-location.js"></script>
  </body>
</html>
